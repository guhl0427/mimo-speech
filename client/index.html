<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="声息 — 只服务 MiMo 的私人语音工作台" />
    <meta name="theme-color" content="#f2ede3" />
    <title>声息 · MiMo 语音工作台</title>
    <script>
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem("shengxi-theme");
        } catch (error) {
          mode = null;
        }
        var dark =
          mode === "dark" ||
          (mode !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var theme = dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? "#14110d" : "#f2ede3";
      })();
    </script>
    <style>
      html { background: #f2ede3; }
      html[data-theme="dark"] { background: #14110d; }
    </style>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%23b23a22'/%3E%3Cpath d='M20 20h24M20 32h24M20 44h14' stroke='%23fff8ef' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
